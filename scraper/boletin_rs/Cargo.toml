[package]
name = "boletin"
version = "0.1.0"
edition = "2021"
rust-version = "1.100"

[dependencies]
regex = "1.13"
regex-automata = "0.4"
regex-syntax = "0.8"
fancy-regex = "0.20"
unicode-normalization = "0.1"
memchr = "2"
aho-corasick = "1"
csv = "1"
csv-core = "0.1"
serde = "1"
itoa = "1"
ryu = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
